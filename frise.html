  <style>
    /* ═══════════════════════════════════════════
       FRISE CHRONOLOGIQUE
    ═══════════════════════════════════════════ */

    body { overflow-x: hidden; }
    /* Fond de la frise : au lieu du crème plat hérité de style.css, une couche
       décorative fixe qui donne de la profondeur — halo chaud en haut, floraison
       rosée en bas, léger dégradé vertical. Fixe = ancrée à l'écran, donc stable
       pendant le long défilement de la timeline, et sans coût de scroll. */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(115% 70% at 50% 0%, #FFF6EE 0%, transparent 55%),
        radial-gradient(85% 55% at 50% 100%, rgba(240,169,189,.28) 0%, transparent 62%),
        linear-gradient(180deg, #FDF6EF 0%, #FBEFE7 100%);
    }

    /* ── Header simple ── */
    /* Header aligné sur celui de arbre-genealogique.html. Frise lie style.css,
       donc on utilise directement les variables de charte (pas de littéraux). */
    .frise-header {
      text-align: center;
      padding: 1.5rem 2rem 1rem;
      position: relative;
      margin-bottom: 0;
    }
    .frise-header h1 {
      font-family: var(--font-serif, 'Cormorant Garamond', Georgia, serif);
      font-size: 2.2rem;
      font-weight: 400;
      color: var(--noir);
    }
    .frise-header h1 em { color: var(--rose-deep); font-style: italic; }
    .frise-header p {
      font-family: var(--font-sans, 'Jost', sans-serif);
      font-size: .72rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--gris);
      margin-top: .4rem;
    }
    /* Bouton retour : DA du CTA du site (pilule pleine rose-deep, texte blanc,
       flèche SVG qui suit currentColor), comme sur l'arbre. */
    .back-btn-frise {
      position: absolute;
      top: 50%; left: 1.5rem;
      transform: translateY(-50%);
      font-family: var(--font-sans, 'Jost', sans-serif);
      font-size: .72rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      background: var(--rose-deep);
      border: 1.5px solid var(--rose-deep);
      border-radius: 50px;
      padding: .5rem 1.4rem;
      display: flex; align-items: center; gap: .4rem;
      transition: background .18s, border-color .18s, box-shadow .18s;
      white-space: nowrap;
    }
    .back-btn-frise:hover {
      background: var(--rose-dark); border-color: var(--rose-dark);
      box-shadow: 0 6px 24px rgba(176,96,112,0.28);
    }
    @media (max-width: 600px) {
      .frise-header { padding: 1.2rem 1.5rem 1rem; }
      .back-btn-frise {
        position: static;
        transform: none;
        margin: 0 auto .9rem;
        width: fit-content;
      }
    }

    /* ── Container principal ── */
    .frise-outer {
      position: relative;
      max-width: 820px;
      margin: 0 auto;
      padding: 1rem 1.5rem 8rem;
    }

    /* SVG branche — absolument positionné */
    .frise-svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    /* ── Événements — grille 3 colonnes ── */
    .frise-event {
      display: grid;
      grid-template-columns: 1fr 64px 1fr;
      align-items: start;
      min-height: 100px;
      margin-bottom: 96px;
      position: relative;
    }

    /* Colonne fleur — toujours col 2 */
    .frise-flower-col {
      grid-column: 2;
      display: flex;
      justify-content: center;
      padding-top: 6px;
    }

    /* Label col 3 pour --right, col 1 pour --left.
       Padding élargi : la fleur est décalée de son côté (voir plus bas), le
       texte doit lui laisser la place. */
    .frise-event--right .frise-label { grid-column: 3; padding-left: 78px; }
    .frise-event--left  .frise-label { grid-column: 1; padding-right: 78px; text-align: right; }

    /* Version cerisier : la fleur quitte le tronc central et se décale vers son
       côté. La branche (dessinée en JS du tronc jusqu'à la fleur) devient alors
       visible. getBoundingClientRect capture le transform, donc le JS suit. */
    .frise-event--right .frise-flower-col { transform: translateX(46px); }
    .frise-event--left  .frise-flower-col { transform: translateX(-46px); }

    /* Bouton fleur */
    .frise-flower {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      width: 56px; height: 56px;
      display: flex; align-items: center; justify-content: center;
      transition: transform .22s cubic-bezier(.34,1.56,.64,1), filter .22s;
      border-radius: 50%;
      position: relative;
    }
    .frise-flower::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232,168,187,.18) 0%, transparent 70%);
      opacity: 0;
      transition: opacity .2s;
    }
    .frise-flower:hover { transform: scale(1.18); }
    .frise-flower:hover::after { opacity: 1; }
    .frise-flower.active {
      transform: scale(1.25);
      filter: drop-shadow(0 0 8px rgba(232,168,187,.6));
    }
    .frise-flower.active::after { opacity: 1; }

    /* Texte label */
    .frise-year {
      font-family: var(--font-serif, 'Cormorant Garamond', Georgia, serif);
      font-size: 1.4rem;
      color: #B06070;
      line-height: 1;
    }
    .frise-title-preview {
      font-size: .8rem;
      color: #7a6a60;
      margin-top: .35rem;
      letter-spacing: .05em;
    }

    /* ═══════════════════════════════════════════
       PANNEAU DE DÉTAIL
    ═══════════════════════════════════════════ */
    /* ═══ Panneau = page de carnet intime ═══
       Fond papier crème, marge de cahier, texte à l'encre, lettrine, photo
       façon polaroïd. Classes et transitions inchangées (JS + bloc mobile
       reposent dessus) : seul l'habillage change. */
    .event-panel {
      position: fixed;
      top: 0; right: 0;
      width: clamp(330px, 46vw, 540px);
      height: 100dvh;
      z-index: 200;
      transform: translateX(110%);
      transition: transform .42s cubic-bezier(.25,.8,.25,1);
      overflow-y: auto;
      overscroll-behavior: contain;
      display: flex;
      flex-direction: column;
      /* Papier crème chaud. (Les lignes de cahier ont été retirées : elles ne
         s'alignaient pas sur le texte et créaient un effet brouillon.) */
      background: linear-gradient(135deg, #FBF3E7 0%, #FDF8F1 55%, #FBF1E6 100%);
      border-left: 1px solid rgba(176,96,112,.22);
      box-shadow: -18px 0 50px rgba(60,40,35,.16),
                  inset 26px 0 40px -30px rgba(120,80,70,.25);
    }
    .event-panel.open { transform: translateX(0); }

    .panel-inner {
      position: relative;
      padding: 2rem 2rem 3rem 3rem;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
      flex: 1;
    }
    /* Ligne de marge verticale, comme un cahier */
    .panel-inner::before {
      content: '';
      position: absolute;
      top: 0; bottom: 0; left: 2.1rem;
      width: 1px;
      background: linear-gradient(to bottom, transparent,
        rgba(196,120,138,.4) 12%, rgba(196,120,138,.4) 88%, transparent);
    }

    .panel-topbar {
      display: flex;
      justify-content: flex-end;
    }
    .panel-close {
      background: transparent;
      border: 1px solid rgba(176,96,112,.35);
      color: var(--rose-deep, #B06070);
      border-radius: 50%;
      width: 34px; height: 34px;
      font-size: .95rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .18s, transform .3s cubic-bezier(.34,1.56,.64,1);
      flex-shrink: 0;
    }
    .panel-close:hover { background: rgba(176,96,112,.1); transform: rotate(90deg); }

    /* Date : en-tête de la page de journal, en italique serif */
    .panel-date-badge {
      align-self: flex-start;
      font-family: var(--font-serif, 'Cormorant Garamond', Georgia, serif);
      font-style: italic;
      font-size: 1.05rem;
      letter-spacing: .04em;
      color: var(--rose-deep, #B06070);
      border: none;
      padding: 0;
    }
    .panel-date-badge::after {
      content: '';
      display: block;
      width: 46px; height: 1px;
      margin-top: .5rem;
      background: rgba(196,120,138,.55);
    }

    .panel-title {
      font-family: var(--font-serif, 'Cormorant Garamond', Georgia, serif);
      font-weight: 500;
      font-size: 1.9rem;
      color: var(--noir, #1C1C1C);
      line-height: 1.15;
      margin: 0;
    }
    .panel-subtitle {
      font-family: var(--font-serif, 'Cormorant Garamond', Georgia, serif);
      font-style: italic;
      font-size: 1.02rem;
      color: var(--gris, #6A6A6A);
      margin: -.4rem 0 0;
    }

    /* Séparateur : petit fleuron centré plutôt qu'un trait */
    .panel-divider {
      height: 0;
      border: none;
      text-align: center;
      margin: .3rem 0;
      color: rgba(196,120,138,.75);
    }
    .panel-divider::before { content: '❦'; font-size: 1rem; }

    .panel-text {
      font-family: var(--font-serif, 'Cormorant Garamond', Georgia, serif);
      font-size: 1.08rem;
      color: #3a2f2a;
      line-height: 1.85;
    }
    .panel-text p { margin: 0 0 1rem; }
    .panel-text p:last-child { margin-bottom: 0; }
    /* Lettrine sur la première lettre, façon page manuscrite */
    .panel-text p:first-child::first-letter {
      font-size: 3rem;
      line-height: .8;
      float: left;
      padding: .1rem .5rem 0 0;
      color: var(--rose-deep, #B06070);
      font-weight: 500;
    }

    /* Photo montée façon polaroïd, légèrement de travers */
    .panel-img {
      width: calc(100% - 1rem);
      display: block;
      margin: .5rem auto;
      background: #fff;
      padding: 8px 8px 26px;
      border-radius: 2px;
      box-shadow: 0 6px 20px rgba(60,40,35,.22);
      transform: rotate(-1.6deg);
      object-fit: cover;
      max-height: 260px;
    }

    .panel-placeholder-note {
      font-family: var(--font-serif, 'Cormorant Garamond', Georgia, serif);
      font-style: italic;
      font-size: .9rem;
      color: var(--rose-deep, #B06070);
      border-top: 1px dashed rgba(196,120,138,.4);
      padding-top: .9rem;
      margin-top: .4rem;
    }

    /* Scrim */
    .panel-scrim {
      position: fixed;
      inset: 0;
      background: rgba(40,25,20,.45);
      z-index: 199;
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s;
    }
    .panel-scrim.visible { opacity: 1; pointer-events: all; }

    /* ═══════════════════════════════════════════
       MOBILE
    ═══════════════════════════════════════════ */
    @media (max-width: 580px) {
      .frise-outer { padding-left: .75rem; padding-right: .75rem; }

      .frise-event {
        grid-template-columns: 1fr 44px 1fr;
        margin-bottom: 64px;
      }
      .frise-flower-col { grid-column: 2; }
      /* Décalage réduit sur mobile : la colonne est étroite */
      .frise-event--right .frise-flower-col { transform: translateX(24px); }
      .frise-event--left  .frise-flower-col { transform: translateX(-24px); }
      .frise-event--right .frise-label {
        grid-column: 3;
        padding-left: 44px;
        padding-right: 0;
        text-align: left;
      }
      .frise-event--left .frise-label {
        grid-column: 1;
        padding-right: 44px;
        padding-left: 0;
        text-align: right;
      }
      .frise-flower { width: 44px; height: 44px; }
      .frise-year { font-size: 1.1rem; }
      .frise-title-preview { font-size: .72rem; }

      .event-panel {
        top: auto; right: 0; bottom: 0; left: 0;
        width: 100%;
        /* Hauteur ajustée au contenu (plafonnée), au lieu d'un 78dvh figé qui
           laissait un grand vide sous les textes courts et montait trop haut. */
        height: auto;
        max-height: 85dvh;
        border-left: none;
        border-top: 1px solid rgba(212,137,154,.2);
        border-radius: 16px 16px 0 0;
        transform: translateY(110%);
        transition: transform .42s cubic-bezier(.25,.8,.25,1);
      }
      .event-panel.open { transform: translateY(0); }
    }
  </style>
</head>

    image: 'img/frise/2024-2026.jpg',
    placeholder: false,
  },
  {
    date: 'Demain',
    title: 'L\'histoire continue de s\'écrire...',
    subtitle: 'Trouver la terre où planter nos racines',
    text: 'Depuis ses débuts, Humming Cob grandit sur des terres qui ne lui appartiennent pas. Malgré les contraintes, chaque saison a permis à l\'aventure de prendre racine et de se développer. Chaque naissance porte en elle une responsabilité. Avant d\'imaginer de nouvelles branches, nous souhaitons offrir à celles qui existent déjà un lieu où s\'épanouir pleinement. Un endroit pensé pour les chevaux, construit à leur rythme, où Humming Cob pourra continuer à grandir, saison après saison.',
    image: 'img/frise/demain 04.jpg',

/* ═══════════════════════════════════════════════════════
   COULEURS PÉTALES
═══════════════════════════════════════════════════════ */
const PINKS = [
  ['#F5C6D2','#EAB8C8'],
  ['#F2D0DC','#E8A8BB'],
  ['#FBDDE6','#F5C6D2'],
  ['#E8A8BB','#F2D0DC'],
  ['#EAB8C8','#FBDDE6'],
];

/* ═══════════════════════════════════════════════════════
   GÉNÉRATION SVG FLEUR SAKURA
═══════════════════════════════════════════════════════ */
function makePetal(angle, s, c1, c2) {
  const a = angle;
  const cos = Math.cos(a), sin = Math.sin(a);
  // Pétale : courbe de Bézier symétrique autour de l'axe angle
  const tipX = (cos * s * 0.85).toFixed(2);
  const tipY = (sin * s * 0.85).toFixed(2);
  const cl1x = (cos * s * 0.35 - sin * s * 0.32).toFixed(2);
  const cl1y = (sin * s * 0.35 + cos * s * 0.32).toFixed(2);
  const cl2x = (cos * s * 0.72 - sin * s * 0.30).toFixed(2);
  const cl2y = (sin * s * 0.72 + cos * s * 0.30).toFixed(2);
  const cr1x = (cos * s * 0.35 + sin * s * 0.32).toFixed(2);
  const cr1y = (sin * s * 0.35 - cos * s * 0.32).toFixed(2);
  const cr2x = (cos * s * 0.72 + sin * s * 0.30).toFixed(2);
  const cr2y = (sin * s * 0.72 - cos * s * 0.30).toFixed(2);
  return `<path d="M 0 0 C ${cl1x} ${cl1y} ${cl2x} ${cl2y} ${tipX} ${tipY} C ${cr2x} ${cr2y} ${cr1x} ${cr1y} 0 0 Z" fill="${c1}" opacity="0.9"/>`;
}

function flowerSVG(size, colors) {
  const s = size * 0.46;
  const [c1, c2] = colors;
  let petals = '';
  for (let i = 0; i < 5; i++) {
    const angle = (Math.PI * 2 * i / 5) - Math.PI / 2;
    petals += makePetal(angle, s, i % 2 === 0 ? c1 : c2, c2);
  }
  // Encoche au bout de chaque pétale
  let notches = '';
  for (let i = 0; i < 5; i++) {
    const angle = (Math.PI * 2 * i / 5) - Math.PI / 2;
    const tx = Math.cos(angle) * s * 0.84;
    const ty = Math.sin(angle) * s * 0.84;
    notches += `<circle cx="${tx.toFixed(2)}" cy="${ty.toFixed(2)}" r="${(s*0.09).toFixed(2)}" fill="rgba(14,8,4,.35)"/>`;
  }
  // Étamines
  let stamens = '';
  for (let i = 0; i < 8; i++) {
    const a = Math.PI * 2 * i / 8;
    const r = s * 0.36;
    stamens += `<circle cx="${(Math.cos(a)*r).toFixed(2)}" cy="${(Math.sin(a)*r).toFixed(2)}" r="${(s*0.048).toFixed(2)}" fill="rgba(230,195,80,.75)"/>`;
  }
  const vb = size / 2;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-vb} ${-vb} ${size} ${size}" width="${size}" height="${size}">
    <g>${petals}${notches}</g>
    <circle cx="0" cy="0" r="${(s*0.24).toFixed(2)}" fill="#fff8d7" opacity="0.95"/>
    ${stamens}
  </svg>`;
}

/* Bourgeon — pour l'événement encore à venir (placeholder). La timeline
   fleurit du passé (fleurs ouvertes) vers le futur, qui reste en germe. */
function budSVG(size, colors) {
  const [c1, c2] = colors;
  const s = size * 0.42;         // bourgeon dodu, proche de la taille d'une fleur
  const vb = size / 2;
  const calyx = '#8f7245';       // calice gold-brun, raccord à la branche
  const f = n => n.toFixed(2);

  const top = -s * 1.0;          // pointe douce, en haut
  const bot = s * 0.72;          // base bombée, en bas
  const w   = s * 0.54;          // demi-largeur

  // Corps en bulbe : large en bas, se referme en pointe arrondie
  const body = `M 0 ${f(top)} C ${f(w)} ${f(top + s*0.5)} ${f(w)} ${f(bot)} 0 ${f(bot)} `
             + `C ${f(-w)} ${f(bot)} ${f(-w)} ${f(top + s*0.5)} 0 ${f(top)} Z`;
  // Moitié droite plus soutenue (volume)
  const shade = `M 0 ${f(top)} C ${f(w)} ${f(top + s*0.5)} ${f(w)} ${f(bot)} 0 ${f(bot)} `
              + `C ${f(w*0.2)} ${f(bot - s*0.2)} ${f(w*0.4)} ${f(top + s*0.45)} 0 ${f(top)} Z`;
  // Calice : une coupe arrondie qui enserre la base du bourgeon
  const cup = `M ${f(-w*0.85)} ${f(bot - s*0.12)} Q 0 ${f(bot + s*0.5)} ${f(w*0.85)} ${f(bot - s*0.12)}`;

  // rotate(-90) : le bourgeon pointe vers la gauche plutôt que vers le haut,
  // comme s'il poussait au bout de sa branche.
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-vb} ${-vb} ${size} ${size}" width="${size}" height="${size}">
    <g transform="rotate(-90)">
      <path d="${body}" fill="${c1}"/>
      <path d="${shade}" fill="${c2}" opacity="0.4"/>
      <path d="${cup}" fill="none" stroke="${calyx}" stroke-width="${f(s*0.2)}" stroke-linecap="round"/>
    </g>
  </svg>`;
}

/* ═══════════════════════════════════════════════════════
   RENDU DES ÉVÉNEMENTS
═══════════════════════════════════════════════════════ */
function renderEvents() {
  const container = document.getElementById('friseEvents');
  EVENTS.forEach((ev, i) => {
    const side = i % 2 === 0 ? 'right' : 'left';
    const colors = PINKS[i % PINKS.length];

    const div = document.createElement('div');
    div.className = `frise-event frise-event--${side}`;

    // Colonne fleur (centre)
    const flowerCol = document.createElement('div');
    flowerCol.className = 'frise-flower-col';
    const btn = document.createElement('button');
    btn.className = 'frise-flower';
    btn.dataset.idx = i;
    btn.setAttribute('aria-label', `${ev.date} — ${ev.title}`);
    // Événement à venir : bourgeon fermé plutôt que fleur ouverte
    btn.innerHTML = ev.placeholder ? budSVG(52, colors) : flowerSVG(52, colors);
    if (ev.placeholder) btn.classList.add('frise-flower--bud');
    flowerCol.appendChild(btn);

    // Colonne label
    const label = document.createElement('div');
    label.className = 'frise-label';
    label.innerHTML = `<div class="frise-year">${ev.date}</div>
      <div class="frise-title-preview">${ev.title}</div>`;

    if (side === 'right') {
      div.appendChild(document.createElement('div')); // colonne gauche vide
      div.appendChild(flowerCol);
      div.appendChild(label);
    } else {
      div.appendChild(label);
      div.appendChild(flowerCol);
      div.appendChild(document.createElement('div')); // colonne droite vide
    }

    container.appendChild(div);
  });
}

/* ═══════════════════════════════════════════════════════
   DESSIN SVG BRANCHE
═══════════════════════════════════════════════════════ */
const SVG_NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
  return el;
}

function drawBranch() {
  const svg = document.getElementById('friseSvg');
  svg.innerHTML = '';

  const outer = document.getElementById('friseOuter');
  const outerRect = outer.getBoundingClientRect();
  const W = outer.offsetWidth;
  const H = outer.offsetHeight;

  // Defs : gradient tronc
  const defs = svgEl('defs', {});
  const grad = svgEl('linearGradient', { id: 'trunkGrad', x1: '0', y1: '0', x2: '0', y2: '1', gradientUnits: 'objectBoundingBox' });
  [['0%','#8a6035','0.2'],['15%','#7a5028','0.85'],['60%','#5c3a18','0.75'],['100%','#3a2208','0.4']].forEach(([off,col,op]) => {
    const s = svgEl('stop', { offset: off, 'stop-color': col, 'stop-opacity': op });
    grad.appendChild(s);
  });
  defs.appendChild(grad);
  svg.appendChild(defs);

  // Positions des fleurs
  const flowers = Array.from(document.querySelectorAll('.frise-flower'));
  if (!flowers.length) return;

  const positions = flowers.map(f => {
    const r = f.getBoundingClientRect();
    return {
      x: r.left + r.width / 2 - outerRect.left,
      y: r.top + r.height / 2 - outerRect.top,
      side: f.closest('.frise-event').classList.contains('frise-event--right') ? 'right' : 'left',
    };
  });

  const cx = W / 2;
  const startY = positions[0].y - 70;
  const endY   = positions[positions.length - 1].y + 90;

  // ── Tronc sinueux ──
  let trunkD = `M ${cx.toFixed(1)} ${startY.toFixed(1)}`;
  positions.forEach((p, i) => {
    const prevY = i === 0 ? startY : positions[i - 1].y;
    const midY  = (prevY + p.y) / 2;
    const wave  = (i % 2 === 0 ? 6 : -6);
    trunkD += ` C ${(cx + wave).toFixed(1)} ${(prevY + (p.y-prevY)*0.35).toFixed(1)} ${(cx - wave).toFixed(1)} ${(midY).toFixed(1)} ${cx.toFixed(1)} ${p.y.toFixed(1)}`;
  });
  trunkD += ` L ${cx.toFixed(1)} ${endY.toFixed(1)}`;

  // Tronc principal (dégradé brun)
  svg.appendChild(svgEl('path', {
    d: trunkD,
    stroke: 'url(#trunkGrad)',
    'stroke-width': '3.4',
    fill: 'none',
    'stroke-linecap': 'round',
    'stroke-linejoin': 'round',
  }));
  // Texture d'écorce, en deux passes légères par-dessus le tronc :
  // 1) un reflet clair décalé qui arrondit le tronc (effet cylindrique)
  svg.appendChild(svgEl('path', {
    d: trunkD,
    transform: 'translate(-0.7 0)',
    stroke: '#b0895a',
    'stroke-width': '1',
    fill: 'none',
    'stroke-linecap': 'round',
    opacity: '0.45',
  }));
  // 2) de courtes stries sombres (lenticelles) via un pointillé irrégulier
  svg.appendChild(svgEl('path', {
    d: trunkD,
    stroke: '#3a2208',
    'stroke-width': '3.4',
    fill: 'none',
    'stroke-linecap': 'butt',
    'stroke-dasharray': '1 9 1 15 2 11',
    opacity: '0.22',
  }));

  // ── Branches vers les fleurs ──
  positions.forEach((p, i) => {
    // Branche du tronc jusqu'au CENTRE de la fleur : arrivée quasi horizontale
    // pour que la branche se glisse sous le cœur de la fleur, et non vers un
    // pétale. On prolonge un peu au-delà du centre (offX*7) : la fleur étant
    // opaque et dessinée par-dessus, le raccord disparaît proprement dessous.
    const offX = p.side === 'right' ? 1 : -1;
    const cp1x = cx + offX * 28;
    const cp1y = p.y - 2;
    const cp2x = p.x - offX * 12;
    const cp2y = p.y;
    const endX = p.x + offX * 7;

    svg.appendChild(svgEl('path', {
      d: `M ${cx.toFixed(1)} ${p.y.toFixed(1)} C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)} ${cp2x.toFixed(1)} ${cp2y.toFixed(1)} ${endX.toFixed(1)} ${p.y.toFixed(1)}`,
      stroke: '#6b4422',
      'stroke-width': '2.6',
      fill: 'none',
      'stroke-linecap': 'round',
      opacity: '0.78',
    }));

    // (Branchette décorative du côté opposé retirée : depuis que les fleurs
    //  sont décalées, elle créait une fourche parasite en face de chaque fleur.)
  });

  // ── Pétales tombants décoratifs ──
  // Deux couches pour donner de la profondeur : de gros pétales estompés en
  // arrière-plan, puis des pétales plus nets par-dessus. Les opacités ont été
  // relevées (avant : 0.10–0.28, quasi invisibles sur le crème).
  const petalColors = ['#EF9FB4','#E687A3','#F3BFCE','#E9ACC0','#D88AA0'];
  const rng = (seed, min, max) => min + ((seed * 9301 + 49297) % 233280) / 233280 * (max - min);

  const drawPetal = (px, py, rx, color, op) => {
    const ry = rx * rng((px|0)*3, 0.5, 0.72);
    const angle = rng((py|0)*7, 0, 360);
    // Forme de pétale (goutte) plutôt qu'une ellipse pure : deux courbes de Bézier
    const d = `M 0 ${-ry} C ${rx} ${-ry*0.4} ${rx} ${ry*0.7} 0 ${ry} C ${-rx} ${ry*0.7} ${-rx} ${-ry*0.4} 0 ${-ry} Z`;
    svg.appendChild(svgEl('path', {
      d, fill: color, opacity: op.toFixed(2),
      transform: `translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${angle.toFixed(0)})`,
    }));
  };

  // Couche de fond : gros pétales estompés, un peu flous en donnant une teinte diffuse
  for (let i = 0; i < 10; i++) {
    const px = cx + rng(i*5+1, -W*0.42, W*0.42);
    const py = startY + rng(i*5+2, 0, endY - startY);
    drawPetal(px, py, rng(i*5+3, 9, 15), petalColors[i % petalColors.length], 0.12 + rng(i*5+4, 0, 0.10));
  }
  // Couche nette : pétales plus petits et bien visibles
  for (let i = 0; i < 26; i++) {
    const px = cx + rng(i*3+1, -W*0.40, W*0.40);
    const py = startY + rng(i*3+2, 0, endY - startY);
    drawPetal(px, py, rng(i*3+3, 4, 8), petalColors[i % petalColors.length], 0.30 + rng(i*11, 0, 0.32));
  }
}

/* ═══════════════════════════════════════════════════════
   PANNEAU — OPEN / CLOSE
═══════════════════════════════════════════════════════ */
let activeIdx = -1;

function openPanel(idx) {
  const ev = EVENTS[idx];
  const panel = document.getElementById('eventPanel');
  const scrim  = document.getElementById('panelScrim');

  document.getElementById('panelDate').textContent     = ev.date;
  document.getElementById('panelTitle').textContent    = ev.title;
  document.getElementById('panelSubtitle').textContent = ev.subtitle;
  document.getElementById('panelText').innerHTML = ev.text
    .split('\n').filter(Boolean).map(p => `<p>${p}</p>`).join('');

  // Image
  const imgWrap = document.getElementById('panelImgWrap');
  imgWrap.innerHTML = '';
  if (ev.image) {
    const img = document.createElement('img');
    img.src = ev.image; img.alt = ev.title; img.className = 'panel-img';
    imgWrap.appendChild(img);
  }

  // Note placeholder
  document.getElementById('panelNote').style.display = ev.placeholder ? 'block' : 'none';

  // Active flower
  document.querySelectorAll('.frise-flower').forEach((f, i) => {
    f.classList.toggle('active', i === idx);
  });

  activeIdx = idx;
  panel.classList.add('open');
  scrim.classList.add('visible');
  panel.scrollTop = 0;
}

function closePanel() {
  document.getElementById('eventPanel').classList.remove('open');
  document.getElementById('panelScrim').classList.remove('visible');
  document.querySelectorAll('.frise-flower').forEach(f => f.classList.remove('active'));
  activeIdx = -1;
}

document.getElementById('panelClose').addEventListener('click', closePanel);
document.getElementById('panelScrim').addEventListener('click', closePanel);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

// Délégation — clic sur une fleur
document.getElementById('friseEvents').addEventListener('click', e => {
  const btn = e.target.closest('.frise-flower');
  if (!btn) return;
  const idx = parseInt(btn.dataset.idx, 10);
  if (activeIdx === idx) { closePanel(); return; }
  openPanel(idx);
});

/* ═══════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════ */
renderEvents();
// drawBranch après paint pour avoir les positions DOM correctes
requestAnimationFrame(() => requestAnimationFrame(drawBranch));
window.addEventListener('resize', drawBranch);
</script>
